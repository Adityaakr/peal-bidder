<script>
  words("#s7-say", 0.3);
  // "Now try to break it. Fake a mandate in the owner's name:"
  camSet("#s7-cam", [670, 680, 630, 440], VIEW);
  inn("#s7-view", 0.3, { d: 0.5 });

  tl.to("#s7-inj", { opacity: 1, duration: 0.35, ease: "power2.out" }, 8.6);
  drift("#s7-cam", [690, 478, 592, 240], VIEW, 9.0, 6.6);

  // "Every refusal is a signed receipt too."
  hlOut("#s7-head", 15.6);
  camTo("#s7-cam", [670, 1160, 630, 640], VIEW, 15.7, 1.2);
  hlIn("#s7-rec", 16.6);
  endScene("#s7-stage");
</script>
