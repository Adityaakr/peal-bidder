[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["vendor"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# The metadata hash is left out so that the committed artifact, a local build and CI agree byte for byte.
bytecode_hash = "none"
cbor_metadata = false
allow_paths = ["../node_modules"]
remappings = [
  "forge-std/=../node_modules/forge-std/src/",
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "qore-pq-kit/=../node_modules/qore-pq-kit/src/",
  "qore-pq-kit-test/=../node_modules/qore-pq-kit/test/",
  "peal-sealed-auction/=vendor/peal-sealed-auction/src/",
  "peal-sealed-auction-test/=vendor/peal-sealed-auction/test/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
# The handler catches what may revert, so any revert is a failed check inside it.
fail_on_revert = true

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = true

[lint]
# The daily limit and the expiry are defined by timestamps on purpose.
exclude_lints = ["block-timestamp"]
ignore = ["test/**/*.sol", "vendor/**/*.sol"]

[fmt]
ignore = ["vendor/**"]
